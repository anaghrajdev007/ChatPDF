<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Conversational AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">PDF Conversational AI</h1>

        <!-- File Upload Section -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Upload PDFs</h2>
            <input 
                type="file" 
                id="pdfFiles" 
                multiple 
                accept=".pdf" 
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            >
            <button 
                id="uploadBtn" 
                class="mt-4 w-full bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition duration-200"
            >
                Upload Files
            </button>
            <p id="uploadStatus" class="mt-2 text-sm text-gray-600"></p>
        </div>

        <!-- Question Section -->
        <div>
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Ask a Question</h2>
            <textarea 
                id="questionInput" 
                placeholder="Type your question here..." 
                class="w-full p-3 border border-gray-300 rounded-md resize-y min-h-[100px] focus:outline-none focus:ring-2 focus:ring-blue-500"
            ></textarea>
            <button 
                id="askBtn" 
                class="mt-4 w-full bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700 transition duration-200"
            >
                Ask Question
            </button>
            <div id="answerOutput" class="mt-4 p-4 bg-gray-50 rounded-md text-gray-800 hidden"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.href; // Adjust this URL based on your API location

            // BUG: Upload PDF files to the server
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const files = document.getElementById('pdfFiles').files;
            const status = document.getElementById('uploadStatus');

            if (files.length === 0) {
                status.textContent = 'Please select at least one PDF file.';
                return;
            }

            status.textContent = 'Uploading...';
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }

            try {
                const response = await fetch(`${API_URL}upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    status.textContent = 'Files uploaded successfully!';
                    status.classList.add('text-green-600');
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.classList.add('text-red-600');
            }
        });

        // Ask question
        document.getElementById('askBtn').addEventListener('click', async () => {
            const question = document.getElementById('questionInput').value.trim();
            const output = document.getElementById('answerOutput');

            if (!question) {
                output.textContent = 'Please enter a question.';
                output.classList.remove('hidden');
                return;
            }

            output.textContent = 'Processing...';
            output.classList.remove('hidden');

            try {
                const response = await fetch(`${API_URL}question`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                const data = await response.json();

                if (response.ok) {
                    output.textContent = data.answer || 'No answer provided.';
                    output.classList.add('text-green-600');
                } else {
                    throw new Error(data.error || 'Question failed');
                }
            } catch (error) {
                output.textContent = `Error: ${error.message}`;
                output.classList.add('text-red-600');
            }
        });
    </script>
</body>
</html>
